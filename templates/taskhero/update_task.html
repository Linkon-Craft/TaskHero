{% extends "partials/home.html" %}

{% block title %}Update Task{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4 p-md-5">

                <h2 class="fw-bold mb-2">
                    Update Task
                </h2>

                <p class="text-muted mb-4">
                    Editing: <strong>{{ task.title }}</strong>
                </p>


                <form
                    action="{% url 'taskhero:update_task' task.id %}"
                    method="POST"
                >

                    {% csrf_token %}

                    {{ form.as_p }}


                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary me-2"
                        >
                            <i class="bi bi-check-circle me-1"></i>
                            Update Task
                        </button>

                        <a
                            href="{% url 'taskhero:task_details' task.id %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
